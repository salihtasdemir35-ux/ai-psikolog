name: APK Oluştur

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Zip dosyasını aç
        run: |
          Z=$(ls -t *.zip | head -1)
          echo "Açılan zip: $Z"
          mkdir -p _app && unzip -q -o "$Z" -d _app
          P=$(find _app -name package.json -not -path "*/node_modules/*" | head -1)
          echo "APP=$(dirname "$P")" >> $GITHUB_ENV

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK hazırla
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platform-tools" "platforms;android-36" "build-tools;36.0.0" > /dev/null || true

      - name: APK derle
        working-directory: ${{ env.APP }}
        run: |
          npm install
          npx cap add android
          npx @capacitor/assets generate --android --assetPath resources --iconBackgroundColor '#7fb3d5' --splashBackgroundColor '#fbf8f2' || true
          node scripts/patch-android.js
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk $GITHUB_WORKSPACE/AI-Psikolog.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AI-Psikolog-APK
          path: AI-Psikolog.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: AI Psikolog v1.0.${{ github.run_number }}
          files: AI-Psikolog.apk
